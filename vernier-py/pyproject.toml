[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "vernier-py"
version = "0.1.0"
description = "Python bindings for vernier-rs — high-resolution pose measurement from coded patterns"
requires-python = ">=3.8"
dependencies = ["numpy"]

[tool.maturin]
module-name = "vernier_py"
features = ["pyo3/extension-module"]
