name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - run: cargo test --workspace --exclude vernier-cuda --exclude vernier-gpu --exclude vernier-cli
      - run: cargo test -p vernier-cli --no-default-features

  native:
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            label: linux
          - os: macos-latest
            label: macos
          - os: windows-latest
            label: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y --no-install-recommends libshaderc-dev libxcb1-dev
          echo "SHADERC_LIB_DIR=$(pkg-config --variable=libdir shaderc)" >> $GITHUB_ENV

      - if: runner.os == 'macOS'
        run: |
          brew install shaderc
          echo "SHADERC_LIB_DIR=$(brew --prefix shaderc)/lib" >> $GITHUB_ENV

      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pip install "cmake<4"
          $cmake = python -c "import cmake, os; print(os.path.join(cmake.CMAKE_BIN_DIR, 'cmake.exe'))"
          "CMAKE=$cmake" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - run: cargo build -p vernier-cli -p vernier-cabi --release

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/vernier* dist/ 2>/dev/null || true
          cp target/release/libvernier_cabi* dist/ 2>/dev/null || true
          cp -r vernier-cabi/include dist/

      - uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.label }}
          path: dist/

  python:
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - run: cargo fetch --locked

      - uses: PyO3/maturin-action@v1
        with:
          working-directory: vernier-py
          args: --release --out dist
          manylinux: off

      - uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.os }}
          path: vernier-py/dist/

  dotnet:
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - run: dotnet pack vernier-dotnet/Vernier.csproj -c Release -o out

      - uses: actions/upload-artifact@v7
        with:
          name: nuget
          path: out/*.nupkg

  release:
    needs: [native, python, dotnet]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v3
        with:
          files: artifacts/**/*
          generate_release_notes: true
