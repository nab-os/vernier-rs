[package]
name = "vernier-webapp"
version = "0.1.0"
edition = "2024"
publish = false
description = "Browser front-end for vernier-patterns: pick a pattern, tune every parameter, see it rendered."

# Its own workspace on purpose. The root workspace builds for the host, and this
# crate only makes sense on wasm32 — keeping it separate means `cargo build` at
# the repo root never has to compile a web renderer it can't run.
[workspace]

[dependencies]
vernier-core = { path = "../vernier-core" }
vernier-patterns = { path = "../vernier-patterns" }

dioxus = { version = "0.7.10", features = ["web"] }
wasm-bindgen = "0.2"

[dependencies.web-sys]
version = "0.3"
features = [
    "CanvasRenderingContext2d",
    "Document",
    "Element",
    "HtmlAnchorElement",
    "HtmlCanvasElement",
    "ImageData",
    "Performance",
    "Window",
]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
