[package]
name = "vernier-webapp"
version = "0.1.0"
edition = "2024"
publish = false
description = "Browser front-end for vernier-patterns: pick a pattern, tune every parameter, see it rendered."

# Its own workspace on purpose. The root workspace builds for the host, and this
# crate only makes sense on wasm32 — keeping it separate means `cargo build` at
# the repo root never has to compile a web renderer it can't run.
[workspace]

[dependencies]
vernier-core = { path = "../vernier-core" }
vernier-patterns = { path = "../vernier-patterns" }
# The explorer runs the detector itself, in the page: the CPU backend and the
# spectral chain both compile to wasm32 unchanged.
vernier-cpu = { path = "../vernier-cpu" }
vernier-spectral = { path = "../vernier-spectral" }
# The code extraction too: the thumbnail panel shows the decoder's own square
# sampling and its own coding sites, not a lookalike redrawn from the phases.
vernier-pose = { path = "../vernier-pose" }
nalgebra = "0.35.0"

dioxus = { version = "0.7.10", features = ["web"] }
wasm-bindgen = "0.2"

[dependencies.web-sys]
version = "0.3"
features = [
    "CanvasRenderingContext2d",
    "Document",
    "Element",
    "HtmlAnchorElement",
    "HtmlCanvasElement",
    "ImageData",
    "Performance",
    "Window",
]

# The generators are per-pixel CPU loops, and an unoptimized wasm build takes
# most of a second on a 512² render — enough to make dragging a slider feel
# broken. Optimizing dev builds costs a little compile time and keeps
# `dx serve` interactive.
[profile.dev]
opt-level = 2

# Speed, not size: this is a compute-bound page whose whole job is running
# per-pixel loops, and a few hundred KB of extra wasm is a better trade than a
# preview that lags behind the slider.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
# wasm-opt aborts on the DWARF this toolchain emits ("compile unit size was
# incorrect"), which silently leaves the bundle unoptimized. Nothing debugs a
# release wasm from its DWARF anyway, so drop it and let wasm-opt run.
strip = "debuginfo"
